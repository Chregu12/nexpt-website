# Include inside the existing HTTPS server for nexpt.ch.
# The generated exports describe the native theme pages, not Ghost's starter posts.
# Consolidate the two unchanged Ghost starter URLs without deleting their content.
location = /about/ { return 301 https://nexpt.ch/work/wer-wir-sind/; }
location = /coming-soon/ { return 301 https://nexpt.ch/work/; }

location = /llms.txt {
    proxy_pass http://127.0.0.1:2368/assets/nexpt-llms.txt;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options nosniff;
}
location = /llms-full.txt {
    proxy_pass http://127.0.0.1:2368/assets/nexpt-llms-full.txt;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options nosniff;
}
